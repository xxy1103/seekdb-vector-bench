[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seekdb-vector-bench"
version = "0.1.0"
description = "Mechanism verification benchmark suite for vector search, quantization, filtered ANN, hybrid RRF, and dual-layer HNSW SLOs aligned with OceanBase seekdb & VSAG."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pyseekdb>=1.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
